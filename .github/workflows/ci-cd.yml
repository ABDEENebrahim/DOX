name: JARVIS CI/CD

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm --workspace @jarvis/api run check
      - run: npm --workspace @jarvis/dashboard run build

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t jarvis-api:${{ github.sha }} .
      - run: docker build -f apps/dashboard/Dockerfile -t jarvis-dashboard:${{ github.sha }} .
